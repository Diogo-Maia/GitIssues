name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build GitIssues/GitIssues.csproj --configuration Release

      - name: Pack
        run: >
          dotnet pack GitIssues/GitIssues.csproj
          --configuration Release
          --no-build
          --output ./packages
          /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target main \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft
